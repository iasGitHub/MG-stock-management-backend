spring:
  application:
    name: stock-management

  config:
    # Dev local (IDE ou terminal) : lit .env.local comme properties — mêmes cles que
    # run-local.ps1 (DB_URL, JWT_SECRET, SEED_DATA...). Optionnel : silencieux si le
    # fichier est absent (CI, image Docker, Railway). Les vraies variables
    # d'environnement restent prioritaires sur ce fichier.
    import: optional:file:./.env.local[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    # Base existante (Railway) sans historique Flyway : baseline à la version 1,
    # V1__init.sql n'est donc exécuté que sur une base fraîche.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:${SERVER_PORT:8080}}

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Donnees de demonstration (admin/manager + produits) : desactivees par defaut.
  # Activer uniquement en local via SEED_DATA=true (voir .env.local).
  seed-data:
    enabled: ${SEED_DATA:false}
  security:
    jwt:
      # NE PAS mettre de valeur par defaut sensible : fournir JWT_SECRET via variable d'env (ou .env.local).
      secret-key: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:86400000} # 24h in milliseconds

logging:
  level:
    com.montagegold.stock: ${LOG_LEVEL:INFO}